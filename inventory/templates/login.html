<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga Kirish | DO'KON POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 1.25rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<div class="card login-card p-4 p-sm-5 bg-white border-0">
    <div class="text-center mb-4">
        <div class="bg-primary bg-opacity-10 text-primary p-3 rounded-circle d-inline-flex mb-3">
            <i class="fas fa-store fa-2x"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">DO'KON POS</h3>
        <p class="text-muted small">Savdo va ombor boshqaruv tizimi</p>
    </div>

    <div id="errorAlert" class="alert alert-danger d-none py-2 small" role="alert">
        <i class="fas fa-exclamation-circle me-1"></i> <span id="errorText">Login yoki parol noto'g'ri!</span>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Foydalanuvchi nomi (Login)</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                <input type="text" id="username" class="form-control bg-light border-start-0" 
                       placeholder="Admin yoki kassa" autocapitalize="none" autocomplete="username" spellcheck="false" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-bold text-secondary">Parol</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" id="password" class="form-control bg-light border-start-0" 
                       placeholder="Parolni kiriting" autocomplete="current-password" required>
            </div>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
            <span id="btnText">Kirish <i class="fas fa-arrow-right ms-1"></i></span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
    </form>
</div>

<script>
async function handleLogin(e) {
    if (e && e.preventDefault) e.preventDefault();

    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const err = document.getElementById('errorAlert');
    const errText = document.getElementById('errorText');
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    if (!u || !p) {
        errText.innerText = "Iltimos, login va parolni to'ldiring!";
        err.classList.remove('d-none');
        return;
    }

    err.classList.add('d-none');
    btn.disabled = true;
    btnText.classList.add('d-none');
    btnSpinner.classList.remove('d-none');

    try {
        // 1) Django session login
        const sessRes = await fetch('/login-session/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });

        // 2) JWT token olish
        const tokenRes = await fetch('/api/token/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });

        if (tokenRes.ok) {
            const data = await tokenRes.json();
            localStorage.setItem('access_token', data.access);
            if (data.refresh) localStorage.setItem('refresh_token', data.refresh);

            // Foydalanuvchi ma'lumotlarini olish
            let role = 'ADMIN';
            try {
                const userRes = await fetch('/api/sales/me/', {
                    headers: { 'Authorization': 'Bearer ' + data.access }
                });
                if (userRes.ok) {
                    const userData = await userRes.json();
                    role = userData.role || 'ADMIN';
                }
            } catch (ignored) {}

            // Yo'naltirish
            if (role === 'ADMIN') {
                window.location.href = '/api/sales/dashboard/';
            } else {
                window.location.href = '/api/sales/pos/';
            }
        } else {
            const errData = await tokenRes.json().catch(() => ({}));
            errText.innerText = errData.detail || "Login yoki parol noto'g'ri!";
            err.classList.remove('d-none');
            btn.disabled = false;
            btnText.classList.remove('d-none');
            btnSpinner.classList.add('d-none');
        }
    } catch (exc) {
        console.error(exc);
        errText.innerText = "Serverga ulanishda xatolik yuz berdi. Internetni tekshiring.";
        err.classList.remove('d-none');
        btn.disabled = false;
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
    }
}
</script>
</body>
</html>
