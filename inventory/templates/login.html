<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Tizimga Kirish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="card p-4 shadow-sm" style="width: 360px;">
    <h4 class="fw-bold text-center mb-3">Tizimga Kirish</h4>
    <div id="errorAlert" class="alert alert-danger d-none">Login yoki parol noto'g'ri!</div>
    <div class="mb-3">
        <label class="form-label">Foydalanuvchi nomi</label>
        <input type="text" id="username" class="form-control" placeholder="Login">
    </div>
    <div class="mb-3">
        <label class="form-label">Parol</label>
        <input type="password" id="password" class="form-control" placeholder="******">
    </div>
    <button onclick="handleLogin()" class="btn btn-primary w-100 fw-bold">Kirish</button>
</div>

<script>
async function handleLogin() {
    let u = document.getElementById('username').value;
    let p = document.getElementById('password').value;
    let err = document.getElementById('errorAlert');
    err.classList.add('d-none');

    // 1) Django session login
    await fetch('/login-session/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({username: u, password: p})
    });

    // 2) JWT token olish
    try {
        let res = await fetch('/api/token/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p})
        });

        if (res.ok) {
            let data = await res.json();
            localStorage.setItem('access_token', data.access);

            let userRes = await fetch('/api/sales/me/', {
                headers: {'Authorization': 'Bearer ' + data.access}
            });
            let userData = await userRes.json();

            if (userData.role === 'ADMIN' || userData.is_superuser) {
                window.location.href = '/api/sales/dashboard/';
            } else {
                window.location.href = '/api/sales/pos/';
            }
        } else {
            err.classList.remove('d-none');
        }
    } catch(e) {
        console.error(e);
    }
}
</script>
</body>
</html>
