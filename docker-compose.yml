services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saas_pos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dukon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_NAME=saas_pos_db
      - DB_USER=postgres
      - DB_PASSWORD=dukon
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
