services:
  - type: web
    name: dokon-pos
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /login/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dokon-db
          property: connectionString

databases:
  - name: dokon-db
    plan: free
    region: frankfurt
    databaseName: saas_pos_db
    user: postgres
