{% extends "base.html" %}

{% block content %}
<div class="container-fluid p-0">
    <h4 class="fw-bold mb-3 text-primary"><i class="fas fa-user-clock me-2"></i>Xodim Aylanmasi Hisoboti</h4>
    <div class="card p-3 shadow-sm border-0">
        <table class="table align-middle table-hover">
            <thead class="table-light">
                <tr><th>№</th><th>Xodim</th><th>Ishlagan Smenalari</th><th>Tushum</th><th>Hisoblangan Oylik</th></tr>
            </thead>
            <tbody id="staffTurnoverBody"></tbody>
        </table>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async function() {
        let token = localStorage.getItem('access_token');
        let res = await fetch('/api/sales/reports/general-data/', { headers: {'Authorization': 'Bearer ' + token} });
        if(res.ok) {
            let data = await res.json();
            let tbody = document.getElementById('staffTurnoverBody');
            tbody.innerHTML = `
                <tr>
                    <td>1</td>
                    <td class="fw-bold">Admin</td>
                    <td><span class="badge bg-success">Aktiv smena</span></td>
                    <td class="fw-bold text-primary">${parseFloat(data.total_sales || 0).toLocaleString()} so'm</td>
                    <td>0 so'm</td>
                </tr>
            `;
        }
    });
</script>
{% endblock %}
